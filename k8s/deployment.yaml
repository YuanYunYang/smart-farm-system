# ============================================================
# 智能农场监测系统 - Kubernetes 部署清单
# ============================================================
apiVersion: v1
kind: Namespace
metadata:
  name: smart-farm
---
# ==================== ConfigMap ====================
apiVersion: v1
kind: ConfigMap
metadata:
  name: smart-farm-config
  namespace: smart-farm
data:
  SPRING_PROFILES_ACTIVE: "prod"
  DB_HOST: "mysql-master.smart-farm.svc.cluster.local"
  DB_SLAVE_HOST: "mysql-slave.smart-farm.svc.cluster.local"
  REDIS_HOST: "redis.smart-farm.svc.cluster.local"
  KAFKA_SERVERS: "kafka.smart-farm.svc.cluster.local:9092"
  MQTT_HOST: "emqx.smart-farm.svc.cluster.local"
  INFLUX_HOST: "influxdb.smart-farm.svc.cluster.local"
  LOG_LEVEL: "info"
---
# ==================== Secret ====================
apiVersion: v1
kind: Secret
metadata:
  name: smart-farm-secret
  namespace: smart-farm
type: Opaque
stringData:
  DB_PASSWORD: "Farm@2024"
  DB_USER: "root"
  REDIS_PASSWORD: "Farm@2024"
  JWT_SECRET: "smartFarmJwtSecretKey2026VeryLongSecretString"
  INFLUX_TOKEN: "farm-super-token-for-influxdb-access"
---
# ==================== Deployment ====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-farm
  namespace: smart-farm
  labels:
    app: smart-farm
spec:
  replicas: 3
  selector:
    matchLabels:
      app: smart-farm
  template:
    metadata:
      labels:
        app: smart-farm
    spec:
      containers:
        - name: smart-farm
          image: yuanyunyang/smart-farm-system:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: smart-farm-config
            - secretRef:
                name: smart-farm-secret
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "1536Mi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
---
# ==================== Service ====================
apiVersion: v1
kind: Service
metadata:
  name: smart-farm
  namespace: smart-farm
spec:
  selector:
    app: smart-farm
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
---
# ==================== HPA 自动扩缩容 ====================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: smart-farm-hpa
  namespace: smart-farm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: smart-farm
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
# ==================== Ingress ====================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smart-farm-ingress
  namespace: smart-farm
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  rules:
    - host: farm.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: smart-farm
                port:
                  number: 8080
