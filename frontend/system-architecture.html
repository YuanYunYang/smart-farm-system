<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧农业大数据平台 — 系统联动架构图</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:"Microsoft YaHei","PingFang SC",-apple-system,sans-serif;
  background:linear-gradient(180deg,#0a1e15 0%,#0d2818 40%,#0a2014 70%,#061810 100%);
  color:#e0e0e0;
  overflow-x:auto;
  min-height:100vh;
}
.wrap {
  min-width:1400px;
  max-width:1920px;
  margin:0 auto;
  padding:20px 30px 40px;
}
/* Header */
.hdr {
  text-align:center;
  margin-bottom:16px;
}
.hdr h1 {
  font-size:24px;
  font-weight:700;
  letter-spacing:6px;
  background:linear-gradient(135deg,#00ff88,#00d4ff,#7c4dff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  text-shadow:0 0 30px rgba(0,255,136,0.2);
}
.hdr .sub {
  font-size:12px;
  color:#4a7a5a;
  letter-spacing:3px;
  margin-top:4px;
}

/* Main SVG container */
.svg-box {
  background:rgba(10,30,21,0.6);
  border:1px solid rgba(0,255,136,0.1);
  border-radius:12px;
  padding:20px;
  box-shadow:0 0 40px rgba(0,255,136,0.05);
  position:relative;
}
.svg-box svg {
  display:block;
  width:100%;
  height:auto;
}

/* Legend */
.legend-bar {
  display:flex;
  justify-content:center;
  gap:30px;
  margin-top:14px;
  flex-wrap:wrap;
}
.lg-item {
  display:flex;
  align-items:center;
  gap:6px;
  font-size:12px;
  color:#888;
}
.lg-dot {
  width:14px;
  height:14px;
  border-radius:3px;
}

/* Tooltip */
.tooltip {
  position:fixed;
  background:rgba(10,30,21,0.95);
  border:1px solid rgba(0,255,136,0.3);
  border-radius:8px;
  padding:8px 14px;
  font-size:12px;
  color:#e0e0e0;
  pointer-events:none;
  z-index:999;
  opacity:0;
  transition:opacity 0.2s;
  max-width:300px;
  box-shadow:0 4px 20px rgba(0,0,0,0.5);
}
.tooltip.show { opacity:1; }
.tooltip .tt-title {
  font-weight:700;
  color:#00ff88;
  margin-bottom:4px;
}
.tooltip .tt-row {
  color:#aaa;
  font-size:11px;
  line-height:1.6;
}

/* Stats */
.stats-row {
  display:flex;
  justify-content:center;
  gap:50px;
  margin-top:16px;
  padding:16px;
  border-top:1px solid rgba(255,255,255,0.04);
}
.st { text-align:center; }
.st .n {
  font-size:26px;
  font-weight:700;
  background:linear-gradient(135deg,#00ff88,#00d4ff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.st .l { font-size:11px; color:#555; margin-top:2px; }

/* Animations */
@keyframes flow-dash {
  to { stroke-dashoffset:-20; }
}
@keyframes pulse-node {
  0%,100% { opacity:0.4; r:4; }
  50% { opacity:1; r:8; }
}
@keyframes blink {
  0%,100% { opacity:1; }
  50% { opacity:0.3; }
}
@keyframes glow-text {
  0%,100% { text-shadow:0 0 5px currentColor; }
  50% { text-shadow:0 0 15px currentColor; }
}

.flow-line {
  fill:none;
  stroke-dasharray:6 4;
  animation:flow-dash 1s linear infinite;
}

.pulse-dot {
  animation:pulse-node 2s ease-in-out infinite;
}
.blink-rect {
  animation:blink 2s ease-in-out infinite;
}

/* Zone hover */
.zone-group { cursor:pointer; transition:opacity 0.3s; }
.zone-group:hover { opacity:0.85; }
</style>
</head>
<body>

<div class="wrap">
  <div class="hdr">

    <div class="sub">SMART AGRICULTURE · DEVICE-ZONE-SYSTEM INTERACTION DIAGRAM</div>

        <!-- Glow filter -->

          <feMerge>

            <feMergeNode in="SourceGraphic"/>

<!-- Tooltip -->
<div class="tooltip" id="tooltip">

  <div class="tt-row" id="ttDesc"></div>
</div>

<script>
(function() {
  const tooltip = document.getElementById('tooltip');
  const ttTitle = document.getElementById('ttTitle');
  const ttDesc = document.getElementById('ttDesc');

  document.querySelectorAll('.zone-group').forEach(el => {
    el.addEventListener('mouseenter', function(e) {
      const tip = this.getAttribute('data-tip');
      if (!tip) return;
      const parts = tip.split('|');
      ttTitle.textContent = parts[0] || '';
      ttDesc.textContent = parts.slice(1).join(' · ') || '';
      tooltip.classList.add('show');
    });
    el.addEventListener('mousemove', function(e) {
      tooltip.style.left = (e.clientX + 15) + 'px';
      tooltip.style.top = (e.clientY + 15) + 'px';
    });
    el.addEventListener('mouseleave', function() {
      tooltip.classList.remove('show');
    });
  });
})();
</script>
