<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧农业大数据平台</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
/* ============ RESET & VARIABLES ============ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
    --primary:#2E8B57;
    --primary-dark:#1a3a2a;
    --primary-light:#90EE90;
    --accent:#FF8C00;
    --accent-light:#FFD700;
    --bg:#f0f5f0;
    --card-bg:#ffffff;
    --text:#333333;
    --text-light:#666666;
    --border:#e0e0e0;
    --success:#52c41a;
    --warning:#faad14;
    --danger:#ff4d4f;
    --info:#1890ff;
    --sidebar-width:240px;
    --header-height:60px;
}
html,body{height:100%}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--text);font-size:14px;overflow:hidden}
a{text-decoration:none;color:inherit}
ul{list-style:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#c8d8c8;border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

/* ============ LAYOUT ============ */
.layout{display:flex;height:100vh;width:100vw}
.sidebar{width:var(--sidebar-width);background:var(--primary-dark);color:#fff;display:flex;flex-direction:column;flex-shrink:0;transition:width .25s;z-index:100}
.sidebar.collapsed{width:64px}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.header{height:var(--header-height);background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--border);flex-shrink:0;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.content{flex:1;overflow-y:auto;padding:16px}

/* ============ SIDEBAR ============ */
.sidebar-logo{height:var(--header-height);display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0}
.sidebar-logo .logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--primary),var(--primary-light));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.sidebar-logo .logo-text{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden}
.sidebar.collapsed .logo-text{display:none}
.nav{flex:1;overflow-y:auto;padding:8px 0}
.nav::-webkit-scrollbar{width:5px}
.nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2)}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 20px;cursor:pointer;color:rgba(255,255,255,.75);font-size:14px;transition:all .15s;border-left:3px solid transparent;white-space:nowrap;user-select:none}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:rgba(46,139,87,.25);color:#fff;border-left-color:var(--primary-light)}
.nav-item .nav-icon{font-size:18px;width:24px;text-align:center;flex-shrink:0}
.nav-item .nav-arrow{margin-left:auto;font-size:10px;transition:transform .2s;opacity:.6}
.nav-group.open .nav-arrow{transform:rotate(90deg)}
.nav-sub{overflow:hidden;max-height:0;transition:max-height .25s ease;background:rgba(0,0,0,.18)}
.nav-group.open .nav-sub{max-height:300px}
.nav-sub .nav-item{padding-left:54px;font-size:13px;color:rgba(255,255,255,.6)}
.nav-sub .nav-item.active{color:#fff}
.sidebar.collapsed .nav-item .nav-text,.sidebar.collapsed .nav-arrow,.sidebar.collapsed .nav-sub{display:none}
.sidebar-toggle{padding:10px 20px;border-top:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.6);cursor:pointer;font-size:13px;text-align:center;flex-shrink:0}
.sidebar-toggle:hover{color:#fff;background:rgba(255,255,255,.05)}

/* ============ HEADER ============ */
.header-left{display:flex;align-items:center;gap:14px}
.menu-toggle{font-size:20px;cursor:pointer;color:var(--text-light);padding:4px}
.header-title{font-size:17px;font-weight:700;color:var(--primary-dark)}
.header-search{display:flex;align-items:center;background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:6px 14px;width:280px;gap:8px}
.header-search input{border:none;background:transparent;outline:none;flex:1;font-size:13px;color:var(--text)}
.header-search .search-icon{font-size:15px;color:var(--text-light)}
.header-right{display:flex;align-items:center;gap:18px}
.header-time{font-size:12px;color:var(--text-light)}
.notif-wrap{position:relative;cursor:pointer;font-size:20px}
.notif-badge{position:absolute;top:-6px;right:-6px;background:var(--danger);color:#fff;font-size:10px;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;font-weight:700}
.user-wrap{display:flex;align-items:center;gap:8px;cursor:pointer}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.user-name{font-size:13px;font-weight:600}

/* ============ CARDS / PANELS ============ */
.card{background:var(--card-bg);border-radius:8px;box-shadow:0 1px 6px rgba(0,0,0,.06);margin-bottom:16px;overflow:hidden}
.card-header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border)}
.card-title{font-size:15px;font-weight:600;color:var(--primary-dark);display:flex;align-items:center;gap:8px}
.card-title::before{content:"";width:4px;height:16px;background:var(--primary);border-radius:2px}
.card-body{padding:18px}
.card-actions{display:flex;gap:8px;align-items:center}

/* ============ BREADCRUMB ============ */
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-light);margin-bottom:14px}
.breadcrumb a{color:var(--primary)}
.breadcrumb .sep{color:#ccc}

/* ============ STAT CARDS ============ */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.stat-card{background:#fff;border-radius:8px;padding:20px;box-shadow:0 1px 6px rgba(0,0,0,.06);position:relative;overflow:hidden;display:flex;align-items:center;gap:16px}
.stat-card .stat-icon{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;flex-shrink:0}
.stat-card .stat-info .stat-label{font-size:13px;color:var(--text-light);margin-bottom:6px}
.stat-card .stat-value{font-size:30px;font-weight:700;line-height:1}
.stat-card .stat-sub{font-size:12px;color:var(--text-light);margin-top:6px}
.stat-card.green .stat-icon{background:linear-gradient(135deg,#2E8B57,#52c41a)}
.stat-card.blue .stat-icon{background:linear-gradient(135deg,#1890ff,#36cfc9)}
.stat-card.orange .stat-icon{background:linear-gradient(135deg,#FF8C00,#FFD700)}
.stat-card.purple .stat-icon{background:linear-gradient(135deg,#722ed1,#9254de)}

/* ============ GRID HELPERS ============ */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}

/* ============ GAUGE ============ */
.gauge-card{background:#fff;border-radius:8px;padding:16px;text-align:center;box-shadow:0 1px 6px rgba(0,0,0,.06);position:relative}
.gauge-ring{width:84px;height:84px;margin:0 auto 8px;position:relative}
.gauge-ring svg{transform:rotate(-90deg)}
.gauge-ring .gauge-val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700}
.gauge-name{font-size:13px;color:var(--text-light);margin-bottom:4px}
.gauge-unit{font-size:12px;color:var(--text-light)}
.gauge-status{font-size:11px;margin-top:6px;padding:1px 8px;border-radius:10px;display:inline-block}

/* ============ TABLES ============ */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:11px 14px;font-size:12px;color:var(--text-light);font-weight:600;border-bottom:2px solid var(--border);background:#fafdfa;white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid #f0f0f0;white-space:nowrap}
tbody tr:hover{background:#f7fcf7}

/* ============ BADGES ============ */
.badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11px;font-weight:600;line-height:1.6}
.badge-success{background:#f6ffed;color:var(--success);border:1px solid #d9f7be}
.badge-warning{background:#fffbe6;color:var(--warning);border:1px solid #ffe58f}
.badge-danger{background:#fff1f0;color:var(--danger);border:1px solid #ffa39e}
.badge-info{background:#e6f7ff;color:var(--info);border:1px solid #91d5ff}
.badge-gray{background:#f5f5f5;color:#999;border:1px solid #e8e8e8}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.dot-green{background:var(--success)}
.dot-yellow{background:var(--warning)}
.dot-red{background:var(--danger)}
.dot-gray{background:#bbb}

/* ============ BUTTONS ============ */
.btn{padding:6px 16px;border-radius:5px;border:1px solid var(--border);cursor:pointer;font-size:13px;background:#fff;color:var(--text);transition:all .15s;display:inline-flex;align-items:center;gap:5px}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:#276f47;color:#fff}
.btn-accent{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-accent:hover{background:#e67e00;color:#fff}
.btn-danger{background:#fff;color:var(--danger);border-color:#ffa39e}
.btn-danger:hover{background:#fff1f0}
.btn-success{background:#fff;color:var(--success);border-color:#b7eb8f}
.btn-sm{padding:3px 10px;font-size:12px}
.btn-lg{padding:9px 22px;font-size:14px}
.btn-group{display:inline-flex;border:1px solid var(--border);border-radius:5px;overflow:hidden}
.btn-group .btn{border:none;border-radius:0;border-right:1px solid var(--border)}
.btn-group .btn:last-child{border-right:none}
.btn-group .btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* ============ FORMS ============ */
.form-row{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.form-group{margin-bottom:12px}
.form-label{font-size:13px;color:var(--text-light);margin-bottom:5px;display:block}
.form-input,.form-select{border:1px solid var(--border);border-radius:5px;padding:7px 12px;font-size:13px;width:100%;outline:none;font-family:inherit;background:#fff;color:var(--text)}
.form-input:focus,.form-select:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(46,139,87,.12)}
.form-inline{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.form-inline .form-group{margin-bottom:0;min-width:140px}

/* ============ TABS ============ */
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--border);margin-bottom:16px}
.tab{padding:8px 18px;cursor:pointer;font-size:13px;color:var(--text-light);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s}
.tab:hover{color:var(--primary)}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}

/* ============ PROGRESS ============ */
.progress{width:100%;height:7px;background:#f0f0f0;border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-light));border-radius:4px;transition:width .3s}

/* ============ VIEWS ============ */
.view{display:none}
.view.active{display:block;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ============ CHART ============ */
.chart-box{position:relative;height:260px}
.chart-box.sm{height:200px}
.chart-box.lg{height:340px}

/* ============ MISC ============ */
.empty{text-align:center;padding:40px;color:var(--text-light);font-size:13px}
.alarm-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #f5f5f5}
.alarm-item:last-child{border-bottom:none}
.alarm-dot{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.alarm-dot.red{background:#fff1f0}
.alarm-dot.yellow{background:#fffbe6}
.alarm-dot.green{background:#f6ffed}
.alarm-content{flex:1;min-width:0}
.alarm-title{font-size:13px;font-weight:500}
.alarm-meta{font-size:11px;color:var(--text-light);margin-top:2px}
.kpi-circle{width:110px;height:110px;margin:0 auto;position:relative;text-align:center}
.kpi-circle .kpi-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.kpi-circle .kpi-num b{font-size:24px;font-weight:700;line-height:1}
.kpi-circle .kpi-num span{font-size:12px;color:var(--text-light);margin-top:4px}
.zone-card{background:#fff;border-radius:8px;padding:14px;box-shadow:0 1px 6px rgba(0,0,0,.06);cursor:pointer;transition:transform .15s;border-top:4px solid var(--primary)}
.zone-card:hover{transform:translateY(-3px);box-shadow:0 4px 12px rgba(0,0,0,.1)}
.zone-card.greenhouse{border-top-color:var(--success)}
.zone-card.fishpond{border-top-color:var(--info)}
.zone-card.outdoor{border-top-color:var(--accent)}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;background:#f0f5f0;color:var(--text-light);margin:2px}
.tag.active{background:var(--primary);color:#fff}
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:1000}
.modal-mask.show{display:flex}
.modal{background:#fff;border-radius:8px;width:480px;max-width:90vw;max-height:85vh;overflow-y:auto}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:15px}
.modal-close{cursor:pointer;font-size:20px;color:var(--text-light)}
.modal-body{padding:20px}
.modal-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.timeline{position:relative;padding-left:24px}
.timeline::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--border)}
.timeline-item{position:relative;margin-bottom:18px;padding-left:18px}
.timeline-item::before{content:"";position:absolute;left:-20px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--primary);border:2px solid #fff;box-shadow:0 0 0 2px var(--primary)}
.timeline-item.done::before{background:var(--success)}
.timeline-item.current::before{background:var(--accent)}
.timeline-date{font-size:12px;color:var(--text-light)}
.timeline-title{font-size:14px;font-weight:600;margin:2px 0}
.timeline-desc{font-size:12px;color:var(--text-light)}
.pyramid{display:flex;flex-direction:column;align-items:center;gap:10px}
.pyramid-row{display:flex;align-items:center;justify-content:center;gap:12px;padding:14px 30px;border-radius:6px;color:#fff;font-weight:600}
.pyramid-row .p-icons{font-size:22px}
.pyramid-top{width:240px;background:linear-gradient(135deg,#1890ff,#36cfc9)}
.pyramid-mid{width:360px;background:linear-gradient(135deg,#faad14,#ffd666)}
.pyramid-bot{width:480px;background:linear-gradient(135deg,#ff4d4f,#ff7875)}
.ptz-pad{display:grid;grid-template-columns:repeat(3,40px);grid-template-rows:repeat(3,40px);gap:4px}
.ptz-btn{background:#f0f5f0;border:1px solid var(--border);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;color:var(--primary-dark)}
.ptz-btn:hover{background:var(--primary);color:#fff}
.ptz-center{background:var(--primary);color:#fff}
.soil-layer{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid var(--border)}
.soil-depth{width:50px;font-size:12px;color:var(--text-light);text-align:right;flex-shrink:0}
.soil-bar{flex:1;height:24px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;font-weight:600}
.video-thumb{aspect-ratio:16/9;background:linear-gradient(135deg,#1a3a2a,#2E8B57);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:28px;color:rgba(255,255,255,.4);cursor:pointer;position:relative;overflow:hidden}
.video-thumb.live::after{content:"LIVE";position:absolute;top:6px;left:6px;background:var(--danger);color:#fff;font-size:9px;padding:1px 5px;border-radius:3px;font-weight:700}
.video-main{aspect-ratio:16/9;background:linear-gradient(135deg,#1a3a2a,#0d1f14);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:48px;color:rgba(255,255,255,.25);position:relative;overflow:hidden}
.video-main .live-badge{position:absolute;top:14px;left:14px;background:var(--danger);color:#fff;font-size:12px;padding:3px 10px;border-radius:4px;font-weight:700;display:flex;align-items:center;gap:5px}
.qr-box{width:160px;height:160px;background:#fff;border:1px solid var(--border);border-radius:8px;padding:10px;display:grid;grid-template-columns:repeat(8,1fr);gap:2px}
.qr-cell{background:#222}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-cell{aspect-ratio:1;background:#fafdfa;border:1px solid #eee;border-radius:4px;padding:4px;font-size:11px;min-height:44px}
.cal-cell.head{background:var(--primary);color:#fff;text-align:center;display:flex;align-items:center;justify-content:center;font-weight:600}
.cal-cell.today{border-color:var(--accent);border-width:2px}
.cal-cell .cal-mark{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:2px}
.slider-track{-webkit-appearance:none;width:100%;height:6px;border-radius:3px;background:#e0e0e0;outline:none}
.slider-track::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--primary);cursor:pointer}
.pagination{display:flex;align-items:center;gap:4px;justify-content:flex-end;margin-top:12px}
.pagination .pg-btn{min-width:30px;height:30px;border:1px solid var(--border);border-radius:4px;background:#fff;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center}
.pagination .pg-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.banner{background:linear-gradient(135deg,var(--primary),var(--primary-light));border-radius:8px;padding:18px 24px;color:#fff;display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.banner h3{font-size:18px}
.banner p{font-size:13px;opacity:.9;margin-top:4px}
.farm-map{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.map-pin{display:inline-flex;align-items:center;gap:4px;font-size:11px;background:rgba(46,139,87,.1);color:var(--primary);padding:2px 6px;border-radius:10px;margin:2px}
.pest-box{position:relative;background:linear-gradient(135deg,#e8f5e8,#d4edd4);border-radius:8px;min-height:240px;display:flex;align-items:center;justify-content:center;font-size:64px;overflow:hidden}
.bbox{position:absolute;border:2px solid var(--danger);border-radius:3px}
.bbox-label{position:absolute;top:-18px;left:-2px;background:var(--danger);color:#fff;font-size:10px;padding:1px 5px;border-radius:3px;white-space:nowrap}
.thumb-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.thumb-item{flex-shrink:0;width:100px;height:70px;background:linear-gradient(135deg,#d4edda,#a8e6a8);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:24px}
.section-title{font-size:14px;font-weight:600;color:var(--primary-dark);margin:0 0 12px}
.info-grid{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:13px}
.info-grid .label{color:var(--text-light)}
.circle-icon{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;flex-shrink:0}
.text-success{color:var(--success)}
.text-warning{color:var(--warning)}
.text-danger{color:var(--danger)}
.text-info{color:var(--info)}
.text-muted{color:var(--text-light)}
.text-center{text-align:center}
.mb-0{margin-bottom:0}
.mt-8{margin-top:8px}
.flex-between{display:flex;justify-content:space-between;align-items:center}
.flex{display:flex;align-items:center;gap:8px}

/* ============ RESPONSIVE ============ */
@media(max-width:1200px){
    .stat-grid{grid-template-columns:repeat(2,1fr)}
    .grid-4{grid-template-columns:repeat(2,1fr)}
    .grid-3{grid-template-columns:repeat(2,1fr)}
    .row-2,.grid-2{grid-template-columns:1fr}
    .header-search{width:200px}
}
@media(max-width:768px){
    .sidebar{position:fixed;left:0;top:0;height:100vh;transform:translateX(-100%);transition:transform .25s}
    .sidebar.show{transform:translateX(0)}
    .sidebar.collapsed{width:var(--sidebar-width)}
    .header-search{display:none}
    .header-time{display:none}
    .farm-map{grid-template-columns:1fr}
    .pyramid-top,.pyramid-mid,.pyramid-bot{width:100%}
}
</style>
</head>

<script>
/* ============================================================
   智慧农业大数据平台 - 前端逻辑
   纯前端 mock 数据 + Chart.js 图表 + 视图切换
   ============================================================ */

/* ---------- Utility ---------- */
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const rnd = (min, max) => Math.random() * (max - min) + min;
const rndInt = (min, max) => Math.floor(rnd(min, max + 1));
const pick = arr => arr[rndInt(0, arr.length - 1)];
const pad = n => String(n).padStart(2, '0');
const fmtDate = (d) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
const lastHours = (n) => { const a=[]; const now=new Date(); for(let i=n-1;i>=0;i--){const t=new Date(now-i*3600*1000);a.push(pad(t.getHours())+':00')} return a; };
const lastDays = (n) => { const a=[]; const now=new Date(); for(let i=n-1;i>=0;i--){const t=new Date(now-i*86400*1000);a.push(`${pad(t.getMonth()+1)}/${pad(t.getDate())}`)} return a; };
const genSeries = (n, min, max, noise) => { const a=[]; let v=rnd(min,max); for(let i=0;i<n;i++){v+=rnd(-noise,noise);v=Math.max(min,Math.min(max,v));a.push(+v.toFixed(1))} return a; };

const CHART_COLORS = ['#2E8B57','#FF8C00','#1890ff','#722ed1','#faad14','#ff4d4f','#13c2c2','#eb2f96'];
let charts = {};       // store chart instances
let initialized = {};  // track lazy init per view

function chartBaseOpts(extra){
    return Object.assign({
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ labels:{ color:'#666', font:{size:11}, boxWidth:14, padding:10 } } },
        scales:{
            x:{ ticks:{color:'#999',font:{size:10}}, grid:{color:'#f0f0f0'} },
            y:{ ticks:{color:'#999',font:{size:10}}, grid:{color:'#f0f0f0'} }
        }
    }, extra||{});
}
function destroyChart(id){ if(charts[id]){charts[id].destroy(); delete charts[id];} }
function makeLineChart(id, labels, datasets, opts){
    destroyChart(id);
    const ctx = document.getElementById(id);
    if(!ctx) return null;
    charts[id] = new Chart(ctx.getContext('2d'), { type:'line', data:{labels, datasets}, options: chartBaseOpts(opts) });
    return charts[id];
}
function makeBarChart(id, labels, datasets, opts){
    destroyChart(id);
    const ctx = document.getElementById(id);
    if(!ctx) return null;
    charts[id] = new Chart(ctx.getContext('2d'), { type:'bar', data:{labels, datasets}, options: chartBaseOpts(opts) });
    return charts[id];
}
function makeDoughnut(id, labels, data, colors){
    destroyChart(id);
    const ctx = document.getElementById(id);
    if(!ctx) return null;
    charts[id] = new Chart(ctx.getContext('2d'), { type:'doughnut', data:{labels, datasets:[{data, backgroundColor:colors, borderWidth:0}]}, options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{color:'#666',font:{size:11},boxWidth:12,padding:8}}}} });
    return charts[id];
}
function makePie(id, labels, data, colors){
    destroyChart(id);
    const ctx = document.getElementById(id);
    if(!ctx) return null;
    charts[id] = new Chart(ctx.getContext('2d'), { type:'pie', data:{labels, datasets:[{data, backgroundColor:colors, borderWidth:0}]}, options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{color:'#666',font:{size:11},boxWidth:12,padding:8}}}} });
    return charts[id];
}

/* gauge ring SVG */
function gaugeSVG(val, color, size=84){
    const r = (size-12)/2, c=2*Math.PI*r;
    const pct = Math.min(100, Math.max(0, val))/100;
    return `<svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#f0f0f0" stroke-width="6"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="6" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct)}" stroke-linecap="round"/></svg>`;
}
function kpiSVG(val, max, color, size=110){
    const r=(size-14)/2, c=2*Math.PI*r, pct=Math.min(1, val/max);
    return `<svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#f5f5f5" stroke-width="8"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="8" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct)}" stroke-linecap="round" transform="rotate(-90 ${size/2} ${size/2})"/></svg>`;
}

/* QR placeholder */
function qrHTML(){
    let html='';
    for(let i=0;i<64;i++){ html += `<div class="qr-cell" style="${Math.random()>0.5?'':'visibility:hidden'}"></div>`; }
    return html;
}

/* status badge helpers */
const STATUS = {
    success:{cls:'badge-success', txt:'正常', dot:'dot-green'},
    warning:{cls:'badge-warning', txt:'警告', dot:'dot-yellow'},
    danger:{cls:'badge-danger', txt:'告警', dot:'dot-red'},
    offline:{cls:'badge-gray', txt:'离线', dot:'dot-gray'},
};
function statusBadge(key){ const s=STATUS[key]||STATUS.success; return `<span class="badge ${s.cls}"><span class="status-dot ${s.dot}"></span>${s.txt}</span>`; }
function randomStatus(){ const r=Math.random(); return r<0.7?'success':r<0.85?'warning':r<0.95?'danger':'offline'; }

/* pagination renderer */
function renderPagination(containerId, total, current=1, perPage=8, onChange){
    const pages = Math.ceil(total/perPage);
    const c = document.getElementById(containerId);
    if(!c) return;
    let html = `<span class="text-muted" style="margin-right:auto">共 ${total} 条 / ${pages} 页</span>`;
    html += `<button class="pg-btn" ${current<=1?'disabled':''} onclick="void(0)">‹</button>`;
    for(let i=1;i<=Math.min(pages,5);i++){
        html += `<button class="pg-btn ${i===current?'active':''}" data-page="${i}">${i}</button>`;
    }
    html += `<button class="pg-btn" ${current>=pages?'disabled':''} onclick="void(0)">›</button>`;
    c.innerHTML = html;
    $$('#'+containerId+' .pg-btn[data-page]').forEach(b => b.addEventListener('click', ()=>onChange(parseInt(b.dataset.page))));
}

/* breadcrumb */
function crumb(name){ return `<div class="breadcrumb"><a onclick="showView('dashboard',document.querySelector('[data-view=dashboard]'))">首页</a><span class="sep">›</span><span>${name}</span></div>`; }

/* ============================================================
   VIEW DEFINITIONS - each builds HTML into #content
   ============================================================ */
const VIEWS = {};

/* ---------- 1. 首页概览 ---------- */
VIEWS.dashboard = {
    title:'首页概览',
    html: ()=>`
    ${crumb('首页概览')}
    <div class="stat-grid">
        <div class="stat-card green"><div class="stat-icon">🏡</div><div class="stat-info"><div class="stat-label">农场总数</div><div class="stat-value">12</div><div class="stat-sub">已注册农场</div></div></div>
        <div class="stat-card blue"><div class="stat-icon">📡</div><div class="stat-info"><div class="stat-label">传感器数</div><div class="stat-value">356</div><div class="stat-sub">在线 342 / 离线 14</div></div></div>
        <div class="stat-card orange"><div class="stat-icon">⚠️</div><div class="stat-info"><div class="stat-label">今日告警</div><div class="stat-value">8</div><div class="stat-sub">待处理 3 / 已处理 5</div></div></div>
        <div class="stat-card purple"><div class="stat-icon">✅</div><div class="stat-info"><div class="stat-label">在线设备</div><div class="stat-value">342</div><div class="stat-sub">在线率 96.1%</div></div></div>
    </div>
    <div class="card">
        <div class="card-header"><span class="card-title">实时环境数据</span><span class="text-muted" style="font-size:12px">更新于 <span id="dashTime"></span></span></div>
        <div class="card-body"><div class="grid-4" id="dashGauges"></div></div>
    </div>
    <div class="row-2">
        <div class="card">
            <div class="card-header"><span class="card-title">24小时温湿度趋势</span></div>
            <div class="card-body"><div class="chart-box"><canvas id="dashTempChart"></canvas></div></div>
        </div>
        <div class="card">
            <div class="card-header"><span class="card-title">农场分区状态</span></div>
            <div class="card-body" style="padding:0"><div class="table-wrap"><table id="dashZoneTable"><thead><tr><th>分区名称</th><th>传感器数</th><th>在线数</th><th>状态</th></tr></thead><tbody></tbody></table></div></div>
        </div>
    </div>
    <div class="card">
        <div class="card-header"><span class="card-title">最近告警</span><button class="btn btn-sm btn-primary" onclick="showView('alarm',document.querySelector('[data-view=alarm]'))">查看全部</button></div>
        <div class="card-body" id="dashAlarms"></div>
    </div>`,
    init: ()=>{
        // gauges
        const params=[
            {n:'空气温度',u:'°C',v:26.4,min:10,max:35,ok:[15,32]},
            {n:'空气湿度',u:'%',v:68,min:20,max:100,ok:[40,85]},
            {n:'土壤湿度',u:'%',v:42,min:0,max:100,ok:[30,70]},
            {n:'光照强度',u:'lux',v:18420,min:0,max:80000,ok:[5000,50000]},
            {n:'CO₂浓度',u:'ppm',v:620,min:300,max:2000,ok:[400,1000]},
            {n:'土壤PH',u:'',v:6.8,min:4,max:9,ok:[5.5,7.5]},
            {n:'风速',u:'m/s',v:3.2,min:0,max:20,ok:[0,10]},
            {n:'降雨量',u:'mm',v:0.5,min:0,max:50,ok:[0,15]},
        ];
        $('#dashGauges').innerHTML = params.map(p=>{
            const ok = p.v>=p.ok[0]&&p.v<=p.ok[1];
            const color = ok?'#52c41a':'#ff4d4f';
            const pct = ((p.v-p.min)/(p.max-p.min))*100;
            const st = ok?STATUS.success:STATUS.warning;
            return `<div class="gauge-card"><div class="gauge-ring">${gaugeSVG(pct,color)}<div class="gauge-val">${p.v}</div></div><div class="gauge-name">${p.n}</div><div class="gauge-unit">${p.v}${p.u}</div><span class="gauge-status badge ${st.cls}">${st.txt}</span></div>`;
        }).join('');
        $('#dashTime').textContent = fmtDate(new Date());
        // temp chart
        const labels = lastHours(24);
        makeLineChart('dashTempChart', labels, [
            {label:'温度(°C)', data:genSeries(24,20,32,2), borderColor:'#ff4d4f', backgroundColor:'rgba(255,77,79,.1)', fill:true, tension:.4, borderWidth:2, pointRadius:0},
            {label:'湿度(%)', data:genSeries(24,45,80,5), borderColor:'#1890ff', backgroundColor:'rgba(24,144,255,.08)', fill:true, tension:.4, borderWidth:2, pointRadius:0}
        ]);
        // zone table
        const zones=['大棚A区','大棚B区','鱼塘C区','户外D区','果园E区','育苗F区'];
        $('#dashZoneTable tbody').innerHTML = zones.map(z=>{
            const total=rndInt(20,60), online=total-rndInt(0,4), st=randomStatus();
            return `<tr><td>${z}</td><td>${total}</td><td>${online}</td><td>${statusBadge(st)}</td></tr>`;
        }).join('');
        // alarms
        const alarmData=[
            {t:'大棚A区温度超限',d:'空气温度 35.6°C 超过阈值 35°C',time:'10分钟前',s:'danger',i:'🌡️'},
            {t:'鱼塘C区溶解氧偏低',d:'溶解氧 4.2mg/L 低于阈值 5mg/L',time:'25分钟前',s:'warning',i:'💧'},
            {t:'传感器SF-021离线',d:'设备已超过30分钟未上报数据',time:'1小时前',s:'danger',i:'📡'},
            {t:'户外D区土壤湿度低',d:'土壤湿度 22% 低于阈值 30%',time:'2小时前',s:'warning',i:'🌱'},
            {t:'果园E区设备低电量',d:'电池电量 18%，请及时更换',time:'3小时前',s:'success',i:'🔋'},
        ];
        $('#dashAlarms').innerHTML = alarmData.map(a=>`<div class="alarm-item"><div class="alarm-dot ${a.s}">${a.i}</div><div class="alarm-content"><div class="alarm-title">${a.t}</div><div class="alarm-meta">${a.d} · ${a.time}</div></div>${statusBadge(a.s)}</div>`).join('');
    }
};

VIEWS.weather = {
    title:'气象监测',
    html:()=>`
    ${crumb('气象监测')}

    for(let i=0;i<Math.min(perPage,total-start);i++){
        const lv=pick(levels); 
        rows.push(`<tr><td>${fmtDate(new Date(Date.now()-(start+i)*60000*3))}</td><td><span class="badge badge-${lv.c}">${lv.k}</span></td><td>${pick(mods)}</td><td>${pick(['admin','farm_mgr','irri_op','viewer1'])}</td><td>${pick(acts)}</td><td>192.168.${rndInt(1,254)}.${rndInt(1,254)}</td><td class="text-muted">${pick(['操作成功','参数已更新','设备已添加','规则已删除','数据导出完成'])}</td></tr>`);
    }
    $('#logBody').innerHTML=rows.join('');
    renderPagination('logPagination', total, window._logPage, perPage, p=>{window._logPage=p;renderLogs();});
}

/* ============================================================
   VIEW SWITCHING & INIT
   ============================================================ */
function showView(viewId, navEl){
    const v = VIEWS[viewId];
    if(!v) return;
    // hide all
    $$('.view').forEach(el=>el.classList.remove('active'));
    // build if not built
    let viewEl = document.getElementById('view-'+viewId);
    if(!viewEl){
        viewEl = document.createElement('div');
        viewEl.className='view';
        viewEl.id='view-'+viewId;
        viewEl.innerHTML = v.html();
        $('#content').appendChild(viewEl);
    } else {
        // refresh content each time to simulate live data
        viewEl.innerHTML = v.html();
    }
    viewEl.classList.add('active');
    // nav active
    $$('.nav-item').forEach(n=>n.classList.remove('active'));
    if(navEl) navEl.classList.add('active');
    // init charts/data
    // small delay to ensure DOM is rendered
    setTimeout(()=>{ try{ v.init(); }catch(e){ console.error('init error for '+viewId, e); } }, 30);
    // close sidebar on mobile
    if(window.innerWidth <= 768) $('#sidebar').classList.remove('show');
}

function toggleGroup(id){
    const g = document.getElementById(id);
    if(g) g.classList.toggle('open');
}

function toggleSidebar(){
    const sb = $('#sidebar');
    if(window.innerWidth <= 768){
        sb.classList.toggle('show');
    } else {
        sb.classList.toggle('collapsed');
    }
}

/* ---------- HEADER TIME ---------- */
function updateHeaderTime(){
    const el = document.getElementById('headerTime');
    if(el){ const d=new Date(); el.textContent = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
}

/* ---------- INIT ---------- */
window.addEventListener('load', ()=>{
    updateHeaderTime();
    setInterval(updateHeaderTime, 1000);
    // default open first nav group for discoverability
    document.getElementById('grp-env').classList.add('open');
    // load dashboard
    showView('dashboard', document.querySelector('[data-view=dashboard]'));
});

// close modal on mask click
document.getElementById('modalMask').addEventListener('click', function(e){
    if(e.target === this) closeModal();
});
